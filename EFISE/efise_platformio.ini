; ******************************************************************************************
; EFISE - the A320 EFIS left barometric screen, one OLED on an Arduino Mega
; ******************************************************************************************
;
; The board this builds for is a full console: an LCD, a 7-segment display,
; about thirty buttons, ten encoders, nine LEDs, and this one OLED. Every
; identity string below is the one already stored on it - change any of them
; and MobiFlight stops recognising the module, which means rebinding all 53
; devices by hand.

[env_efise]
build_flags =
	-DMF_CUSTOMDEVICE_SUPPORT=1							; Required for Custom Devices
	-DMF_CUSTOMDEVICE_HAS_UPDATE						; the drum and the deferred repaint both live in update()
	;-DMF_CUSTOMDEVICE_POLL_MS=10 						; deliberately left off: update() is already cheap per call
	-DSSD1306_NO_SPLASH									; disable Adafruit splash logo for SSD1306 displays
	-DSH110X_NO_SPLASH									; disable Adafruit splash logo for SH1106 displays
	-I./src/src/MF_CustomDevice							; don't change this one!
	-I./EFISE											; headers for this custom device
build_src_filter =
	+<./MF_CustomDevice>								; don't change this one!
	+<../EFISE>											; sources for this custom device
lib_deps =												; You can add additional libraries if required
	adafruit/Adafruit GFX Library @ ^1.11.9
	adafruit/Adafruit SSD1306 @ ^2.5.9
	adafruit/Adafruit SH110X @ ^2.1.10
custom_core_firmware_version = 3.0.0					; core the build is based on
custom_source_folder = EFISE							; path to the Custom Device sources
custom_community_project = EFISE						; Folder name inside the ZIP file
custom_zip_filename = EFISE								; Name of the generated ZIP file


[env:efise_mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
	${env.build_flags}									; don't change this one!
	${env_efise.build_flags}							; don't change this one!
	; These three came from the board headers in core 2.5.1 and have to be
	; stated explicitly in 3.0.0. Getting them WRONG is how a console loses its
	; configuration: the firmware would declare a buffer shorter than the one
	; the old firmware wrote into, and the stored config would be truncated on
	; read. Measured against the board on 2026-08-28: 850 of 1496 bytes of
	; config, 521 of 1000 bytes of names, 53 devices.
	-DMEMLEN_CONFIG=1496								; max. size for config stored in EEPROM (matches EEPROMSize in board.json)
	-DMEMLEN_NAMES_BUFFER=1000							; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=1600								; max. memory size for devices
	'-DMOBIFLIGHT_TYPE="Gagagu FCU/EFIS Mega"'			; must match "MobiFlightType" in the board .json AND what the board reports
	'-DMOBIFLIGHT_NAME="Mobiflight Mega"'				; only a default - the board's real name lives in EEPROM and survives a flash
build_unflags =											; Types this console does not use, dropped from the build.
	-DMF_STEPPER_SUPPORT								; MF_SEGMENT and MF_LCD stay: there is a MAX7219/TM1637
	-DMF_SERVO_SUPPORT									; display and an I2C LCD on this board. Buttons, encoders
	-DMF_OUTPUT_SHIFTER_SUPPORT							; and outputs are never behind a flag at all.
	-DMF_INPUT_SHIFTER_SUPPORT							; MF_ANALOG stays until flash is measured - dropping it
	-DMF_MUX_SUPPORT									; saves ~1.2 kB, but there is no reason to guess yet.
	-DMF_DIGIN_MUX_SUPPORT
build_src_filter =
	${env.build_src_filter}								; don't change this one!
	${env_efise.build_src_filter}						; don't change this one!
lib_deps =
	${env.lib_deps}										; don't change this one!
	${env.custom_lib_deps_Atmel}						; don't change this one!
	${env_efise.lib_deps}								; don't change this one!
monitor_speed = 115200									; don't change this one!
extra_scripts =
	${env.extra_scripts}								; don't change this one!
	copy_fw_files.py
custom_core_firmware_version = ${env_efise.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_efise.custom_community_project}			; don't change this one!
custom_source_folder = ${env_efise.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_efise.custom_zip_filename}						; don't change this one!
