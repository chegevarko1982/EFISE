name: Firmware release

on:
  release:
    types: [published]

# softprops/action-gh-release attaches the built ZIP to the release, which is a
# write to repository contents. The default token is read-only, so without this
# the build succeeds and the release ends up with no firmware attached.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini')}}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Run PlatformIO
        env:
          # The tag is the version. get_version.py strips the leading "v"
          # itself, so "v1.0.0" here produces oled_monitor_panel_mega_1_0_0.hex
          # - which is the name board.json tells MobiFlight to look for. This
          # used to come from a third-party action; the tag was always right
          # here for the taking.
          VERSION: ${{ github.event.release.tag_name }}
        run: pio run

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZIP files
          path: ./_dist/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./_dist/*.zip
